<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Service details · ServiceConnect</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" href="css/style.css"><script src="js/api.js"></script></head><body><nav class="navbar"><a class="brand" href="index.html">Service<span>Connect</span></a><a href="services.html">← All services</a></nav><main class="container" id="details"><p>Loading…</p></main><script>const id=new URLSearchParams(location.search).get('id');api.get(`/services/${id}`).then(async s=>{document.querySelector('#details').innerHTML=`<article class="card"><span class="tag">${escapeHtml(s.category_name)}</span><h1>${escapeHtml(s.service_name)}</h1><p>${escapeHtml(s.description||'A professional local service tailored to your needs.')}</p><div class="grid" style="grid-template-columns:2fr 1fr"><section><h2>Provider</h2><h3>${escapeHtml(s.provider.business_name)}</h3><p>${escapeHtml(s.provider.description||'')}</p><p class="muted">${escapeHtml(s.provider.city)} · ${s.provider.experience_years} years’ experience · ★ ${s.provider.rating||'New'}</p><div id="reviews"></div></section><aside class="card"><span class="eyebrow">Starting price</span><p class="price">${money(s.price)}</p><p class="muted">Estimated time: ${s.estimated_duration} minutes</p><a id="book" class="btn" href="login.html">Book this service</a></aside></div></article>`;try{const rv=await api.get(`/providers/${s.provider_id}/reviews`);document.querySelector('#reviews').innerHTML=rv.length?'<h3>Recent reviews</h3>'+rv.map(r=>`<p>★ ${r.rating} — ${escapeHtml(r.comment)}</p>`).join(''):'<p class="muted">No reviews yet.</p>'}catch{};document.querySelector('#book').onclick=async e=>{try{const u=await api.get('/auth/me');if(u.role!=='customer'){alert('Sign in with a customer account to book.');return}e.currentTarget.href=`customer/dashboard.html`;sessionStorage.setItem('sc_booking_service',s.service_id);location.href=`customer/book.html?service_id=${s.service_id}`}catch{location.href='login.html'}}}).catch(e=>document.querySelector('#details').innerHTML=`<div class="notice error">${escapeHtml(e.message)}</div>`)</script></body></html>
