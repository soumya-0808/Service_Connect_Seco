<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Find services · ServiceConnect</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" href="css/style.css"><script src="js/api.js"></script></head><body><nav class="navbar"><a class="brand" href="index.html">Service<span>Connect</span></a><div class="navlinks"><a href="login.html">Sign in</a><a class="btn" href="register.html">Get started</a></div></nav><main class="container"><span class="eyebrow">Local professionals</span><h1>Explore services</h1><form class="searchbar" id="filters"><input name="search" placeholder="Search a service"><input name="city" placeholder="City"><select name="category_id"><option value="">All categories</option></select><button>Search</button></form><div id="results" class="grid" style="margin-top:22px"></div></main><script>async function load(){try{const qs=new URLSearchParams(new FormData(document.querySelector('#filters')));for(const [k,v] of [...qs])if(!v)qs.delete(k);const [d,c]=await Promise.all([api.get('/services/?'+qs),api.get('/categories/')]);const sel=document.querySelector('[name=category_id]');if(sel.options.length===1)sel.innerHTML+=c.map(x=>`<option value="${x.category_id}">${escapeHtml(x.category_name)}</option>`).join('');const el=document.querySelector('#results');el.innerHTML=d.items.length?d.items.map(s=>`<article class="card service-card"><span class="tag">${escapeHtml(s.category_name)}</span><h2>${escapeHtml(s.service_name)}</h2><p>${escapeHtml(s.description||'Professional local service')}</p><p class="muted">${escapeHtml(s.provider.business_name)} · ${escapeHtml(s.provider.city)} · ★ ${s.provider.rating||'New'}</p><div class="bottom"><span class="price">${money(s.price)}</span><a class="btn" href="service-details.html?id=${s.service_id}">Details</a></div></article>`).join(''):'<div class="empty">No matching services yet. Try another search or location.</div>'}catch(e){document.querySelector('#results').innerHTML=`<p class="error">${escapeHtml(e.message)}</p>`}}document.querySelector('#filters').onsubmit=e=>{e.preventDefault();load()};load()</script></body></html>
