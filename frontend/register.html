<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Create account · ServiceConnect</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" href="css/style.css"><script src="js/api.js"></script><script src="js/auth.js"></script></head><body><nav class="navbar"><a class="brand" href="index.html">Service<span>Connect</span></a><a href="login.html">Sign in</a></nav><main class="container"><form class="card form-card" id="register"><span class="eyebrow">Join ServiceConnect</span><h1>Create your account</h1><div class="field"><label>I am joining as</label><select id="role" name="role"><option value="customer">Customer</option><option value="provider">Service provider</option></select></div><div class="field"><label>Full name</label><input name="full_name" required minlength="2"></div><div class="field"><label>Email</label><input type="email" name="email" autocomplete="email" required></div><div class="field"><label>Phone (optional)</label><input name="phone" type="tel"></div><div class="field"><label>Password (8+ characters)</label><input name="password" type="password" minlength="8" required></div><div id="provider-fields" hidden><div class="field"><label>Business name</label><input name="business_name"></div><div class="field"><label>City</label><input name="city"></div><div class="field"><label>Business description</label><textarea name="description"></textarea></div></div><button type="submit" style="width:100%">Create account</button><p class="muted">By registering as a provider, your profile will be reviewed by an administrator.</p></form></main><script>const role=document.querySelector('#role'),pf=document.querySelector('#provider-fields');role.value=new URLSearchParams(location.search).get('role')||'customer';pf.hidden=role.value!=='provider';role.onchange=()=>pf.hidden=role.value!=='provider';registerForm(document.querySelector('#register'))</script></body></html>
