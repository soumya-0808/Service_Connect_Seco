<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Book service · ServiceConnect</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" href="../css/style.css"><script src="../js/api.js"></script><script src="../js/auth.js"></script><script src="../js/booking.js"></script></head><body><nav class="navbar"><a class="brand" href="../index.html">Service<span>Connect</span></a><a href="../services.html">Browse services</a></nav><main class="container"><form id="booking-form" class="card form-card"><span class="eyebrow">Appointment request</span><h1>Book a service</h1><p id="service-summary" class="notice">Loading service…</p><input type="hidden" id="service_id" name="service_id"><div class="form-row"><div class="field"><label>Date</label><input type="date" name="booking_date" required></div><div class="field"><label>Start time</label><input type="time" name="start_time" required></div></div><div class="field"><label>Service address</label><textarea name="address" required minlength="5"></textarea></div><div class="field"><label>What do you need help with?</label><textarea name="problem_description"></textarea></div><button>Request booking</button></form></main><script>requireRole('customer').then(u=>u&&loadBookingForm());document.querySelector('[name=booking_date]').min=new Date().toISOString().slice(0,10)</script></body></html>
